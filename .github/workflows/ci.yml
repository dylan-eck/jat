name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders; this job never talks to a database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      NEON_AUTH_BASE_URL: https://example.invalid/neondb/auth
      NEON_AUTH_COOKIE_SECRET: ci-placeholder-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails if the schema changed without a matching migration.
      - name: Check migrations match the schema
        run: |
          pnpm db:generate
          git add --intent-to-add drizzle
          git diff --exit-code drizzle

      # A throwaway branch of the primary branch. It expires after an hour in
      # case the delete step below never runs.
      - id: expiry
        run: echo "at=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ steps.expiry.outputs.at }}

      - run: pnpm db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.branch.outputs.db_url }}
      - run: pnpm test:db
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}

      - if: always() && steps.branch.outputs.branch_id
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.branch.outputs.branch_id }}
